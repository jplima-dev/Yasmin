[project]
name = "drive2"
version = "1.0.0"
description = "Servidor pessoal híbrido leve para Android/Termux, Tailscale, R2 e Gmail"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
cloud = ["boto3>=1.35,<2.0"]
gmail = [
  "google-api-python-client>=2.140,<3.0",
  "google-auth-httplib2>=0.2,<1.0",
  "google-auth-oauthlib>=1.2,<2.0",
]
full = [
  "boto3>=1.35,<2.0",
  "google-api-python-client>=2.140,<3.0",
  "google-auth-httplib2>=0.2,<1.0",
  "google-auth-oauthlib>=1.2,<2.0",
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
